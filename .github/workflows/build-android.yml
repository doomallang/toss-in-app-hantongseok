name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install

      - name: 웹앱 빌드
        run: npx vite build

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: local.properties 생성
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: AAB 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: 키스토어 복원
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: AAB 서명
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/release.keystore \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -keypass "${{ secrets.SIGNING_KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.SIGNING_KEY_ALIAS }}"

      - name: AAB 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: hantongseok-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
